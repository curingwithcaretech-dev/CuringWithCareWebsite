# Pages CMS (app.pagescms.org): a no-code editor for the Journalism section.
# Who can post: people with write access to this repo (they sign in with GitHub) and the
# collaborators the board has invited by email inside Pages CMS. Nobody else can sign in.
# Saving an entry commits a Markdown file to content/journalism/ and Vercel redeploys.
# Uploaded photos land in public/journalism/ and are resized to web size by
# scripts/optimize-journalism-images.mjs before every build, so any photo size is fine.
media:
  input: public/journalism
  output: /journalism
  extensions: [jpg, jpeg, png, webp]
  rename: safe
content:
  - name: journalism
    label: Journalism
    type: collection
    path: content/journalism
    filename: "{primary}.md"
    exclude: [README.md]
    view:
      fields: [title, author, date, draft]
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
      - name: role
        label: Author's role
        type: string
        description: For example "CARE Journalism" or "Chapter head, North Allegheny"
      - name: date
        label: Date
        type: date
      - name: summary
        label: Summary
        type: text
        description: One or two sentences shown on the Journalism page
      - name: cover
        label: Cover photo
        type: image
        description: Shown wide (16:9) at the top of the article, so a landscape photo works best. Any size; it is resized automatically.
      - name: coverAlt
        label: Cover photo description
        type: string
        description: What the photo shows, for people using screen readers
      - name: draft
        label: Draft (hide from the site)
        type: boolean
        default: false
      - name: body
        label: Article
        type: rich-text
        description: Use the image button to add photos. The description you give a photo is read aloud to people using screen readers; a title becomes a caption under it.
